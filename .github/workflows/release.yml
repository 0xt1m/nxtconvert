# Push a tag like v0.2.0 (matching package.json "version") to release.
# Builds on macOS, Windows and Linux, uploads installers and update files to the public
# 0xt1m/nxtconvert-releases repo, then publishes the release so installed apps offer it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASES_REPO: 0xt1m/nxtconvert-releases

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # One draft up front, so the three builds upload into the same release.
      - name: Create draft release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          awk -v v="$v" '$0 ~ "^## " { if (p) exit; p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "nxtconvert $v" > notes.md
          gh release view "v$v" --repo "$RELEASES_REPO" >/dev/null 2>&1 ||
            gh release create "v$v" --repo "$RELEASES_REPO" --draft --title "nxtconvert $v" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install optional converters (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb pandoc poppler-utils libreoffice-writer
      - name: End-to-end conversions
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm test
      - name: Build and upload
        shell: bash
        run: |
          # Secrets that aren't set arrive as empty strings, which electron-builder would treat as
          # "certificate at path ''" and fail. Leave them out instead: that build is simply unsigned.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            # Without a Developer ID, sign ad hoc. A missing or broken signature makes macOS report the
            # downloaded app as "damaged" with no way to open it; ad hoc gets the usual "Open Anyway".
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Apple only notarizes Developer ID signatures; trying with an ad hoc one fails the build.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            echo "::warning::No MAC_CERTIFICATE secret: the macOS build is signed ad hoc, not notarized, and can't update itself."
          fi
          npx electron-builder --publish always "${extra[@]}"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # macOS signing (Developer ID certificate) and notarization; see docs/RELEASING.md.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release edit "v${{ needs.draft.outputs.version }}" --repo "$RELEASES_REPO" --draft=false --latest
