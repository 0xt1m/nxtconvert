name: build

# Every push and pull request: test and package on all three systems (nothing is published).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Native binaries (sharp, ffmpeg) are installed for the OS that runs `npm ci`,
      # so each installer is built on its own OS.
      - run: npm ci
      - run: npm run typecheck

      # Linux also exercises the optional document converters.
      - name: Install optional converters (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb pandoc poppler-utils libreoffice-writer

      - name: End-to-end conversions
        if: runner.os != 'Linux'
        run: npm test
      - name: End-to-end conversions (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: nxtconvert-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
